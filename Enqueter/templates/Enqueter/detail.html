{% extends "Enqueter/base.html" %}
{% block titre %}{{ page_title }} | PrixMarché{% endblock %}
{% block contenu %}
<section class="panel">
    <h1>{{ page_title }}</h1>
    <dl class="details">
        {% for label, value in detail_rows %}
            <dt>{{ label }}</dt>
            <dd>{{ value }}</dd>
        {% endfor %}
    </dl>
    <div class="actions">
        <a class="button button-light" href="{{ list_url }}">Retour à la liste</a>
        <a class="button" href="{{ update_url }}">Modifier</a>
        <a class="button button-danger" href="{{ delete_url }}">Supprimer</a>
    </div>
</section>
{% endblock %}
